name: Update site data

# 每天 UTC 02:10（北京时间 10:10）抓一次数据：
#   1. GitHub 统计（仓库 / Star / 关注者）
#   2. 博客 atom.xml（文章数 + 最近几篇）
# 有变化才 commit，Vercel 会因为这个 commit 自动重新部署。
on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch GitHub stats
        run: node scripts/fetch-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: lczhuigz

      - name: Fetch blog feed
        run: node scripts/fetch-blog.mjs
        env:
          BLOG_FEED: https://blog.lczhuigz.cn/atom.xml

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github-stats.json src/data/blog.json; then
            echo "数据没有变化，不提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-stats.json src/data/blog.json
          git commit -m "chore: 更新站点数据 $(date -u +%Y-%m-%d)"
          git push
